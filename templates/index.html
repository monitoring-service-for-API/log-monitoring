<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>login</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; height:100vh; margin:0; background:#f2f4f7; font-family:sans-serif; }
    .box { background:#fff; padding:32px; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.1); width:300px; }
    input { width:100%; padding:10px; margin:8px 0; box-sizing:border-box; }
    button { width:100%; padding:10px; background:#3b82f6; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    .error { color:#e11d48; font-size:14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>login</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST" action="/">
      <input type="text" name="username" placeholder="ID" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">login</button>
    </form>
  </div>
</body>
</html>
